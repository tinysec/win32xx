name: build

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - "**"

# Semantic version layout for releases and tags:
#   WIN32XX_VERSION  base 3-component release version, e.g. 9.6.1
#   build tag        v9.6.1.{run_number}  immutable, full four-component version
#   FLOAT_TAG        v9.6.1               floating 3-component tag and release,
#                                         re-pointed to the same commit as the
#                                         latest build tag
env:
  WIN32XX_VERSION: 9.6.1
  FLOAT_TAG: v9.6.1

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: configure
        run: |
          cmake -S . -B build \
            -DWIN32XX_VERSION=${WIN32XX_VERSION}.${{ github.run_number }}

      - name: verify local target
        run: |
          mkdir -p smoke
          cat > smoke/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(win32xx_smoke LANGUAGES CXX)
          include(FetchContent)
          FetchContent_Declare(
                  win32xx
                  SOURCE_DIR "${CMAKE_CURRENT_LIST_DIR}/..")
          FetchContent_MakeAvailable(win32xx)
          add_library(consumer INTERFACE)
          target_link_libraries(consumer INTERFACE win32xx::win32xx)
          EOF
          cmake -S smoke -B smoke-build

  release:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: publish build tag and floating release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TAG: v${{ env.WIN32XX_VERSION }}.${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 1. Immutable four-component build tag carrying the full version.
          git tag "${BUILD_TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${BUILD_TAG}"

          # 2. Re-point the floating three-component tag to the build commit.
          git tag -f "${FLOAT_TAG}" "${GITHUB_SHA}"
          git push -f origin "refs/tags/${FLOAT_TAG}"

          # 3. Refresh the floating release that tracks the latest build.
          gh release delete "${FLOAT_TAG}" --yes || true

          gh release create "${FLOAT_TAG}" \
            --title "Win32++ ${WIN32XX_VERSION} (floating ${FLOAT_TAG})" \
            --notes "Floating release for Win32++ ${WIN32XX_VERSION}. Full build version: ${BUILD_TAG} (build ${GITHUB_RUN_NUMBER}). The floating ${FLOAT_TAG} tag points to ${GITHUB_SHA}."
